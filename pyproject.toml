[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polartx"
version = "0.1.0"
description = "Behavioral simulation of digital polar transmitters: ADPLL two-point (narrowband, BLE/LTE) and open-loop DTC phase modulation (wideband, WiFi 6/7 / 5G NR) with a digital PA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest"]
gui = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
