name: windows-exe-nuitka

# Nuitka ONEFILE Windows executable of the desktop host -- real C
# compilation via MSVC (slower build, faster startup than PyInstaller's
# self-extract).  Same program as windows-exe.yml: polartx.webhost serving
# the one page in an Edge app window, stopping when the window closes.
# Smoke-tested on the runner before upload.
#
# Trigger: Actions -> windows-exe-nuitka -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the exe to (optional)"
        required: false
        default: ""

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        id: nuitka-cache
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-webhost-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-webhost-${{ runner.os }}-py311-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . nuitka ordered-set zstandard
      # console kept (see windows-exe.yml).  --include-package-data=polartx
      # is what carries webui/www; the Agg backend is the only one the
      # reports use (guispec forces it), and Nuitka cannot see that import
      - name: Build exe (Nuitka)
        run: >
          python -m nuitka packaging/launch_webhost.py
          --onefile --assume-yes-for-downloads --msvc=latest
          --windows-icon-from-ico=packaging/icon.ico
          --include-package=polartx
          --include-package-data=polartx
          --include-package-data=matplotlib
          --include-module=matplotlib.backends.backend_agg
          --output-dir=build-nuitka
          --output-filename=polartx-gui-nuitka.exe
      # save the long compile cache even if the smoke step fails
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}-${{ github.run_id }}
      - name: Smoke exe
        run: python packaging/smoke_webhost.py build-nuitka/polartx-gui-nuitka.exe
      - uses: actions/upload-artifact@v4
        with:
          name: polartx-gui-nuitka-windows
          path: build-nuitka/polartx-gui-nuitka.exe
      - name: Attach to release (optional)
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ inputs.release_tag }}"
          build-nuitka/polartx-gui-nuitka.exe --clobber
