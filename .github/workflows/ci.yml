name: CI

on:
  push:
  pull_request:

jobs:
  # Static checks, pinned.  An unpinned linter means a new release can turn
  # CI red on code that did not change, which is the same class of surprise
  # test-floor below exists to prevent.  Config (rule set, what is ignored
  # and why, the vendor exclusion) lives in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The tools come from the pinned dev extra so this job and a laptop
      # cannot disagree about the version.  Everything lands in ONE
      # environment on purpose -- mypy reads numpy's and matplotlib's types
      # from the environment it runs in, so a tool installed in isolation
      # reports success while checking almost nothing.
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # extra Python versions only on Linux to keep the matrix small
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[test]
      - name: Test
        run: pytest tests/ -q
        # OpenDPD-dataset tests skip automatically without the dataset
        # clone; the in-browser page tests skip without Chromium; RTL golden
        # tests skip without iverilog (dedicated jobs below exercise those).

  # pyproject declares numpy>=1.24 / scipy>=1.10 / matplotlib>=3.7, and until
  # this job existed nothing ever ran at those versions -- the matrix above
  # always resolves the newest.  The declaration was false for months: numpy
  # renamed trapz -> trapezoid in 2.0, a vendored integrator used the new name
  # only, and EVERY narrowband ADPLL preset raised AttributeError on numpy 1.x.
  # It surfaced on Android, where Chaquopy's wheel for Python 3.10 is numpy 1.x
  # -- the first place a floor-version numpy ever actually ran this code.
  # 37 tests failed there while CI was green.
  test-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the DECLARED minimums, not the newest
        run: |
          pip install "numpy==1.24.4" "scipy==1.10.1" "matplotlib==3.7.5" pytest
          pip install --no-deps -e .
      - name: Test at the floor
        run: pytest tests/ -q

  # The one page every host shows (src/polartx/webui/www): its script in
  # jsdom, the page in a real Chromium against the real bridge, and the
  # desktop host the way the Windows exe smoke-tests it.  The Streamlit and
  # Qt front ends this job used to run retired in GUI P4b.
  test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .[test]
      # jsdom, so the Android page harness RUNS here rather than skipping.
      # The pytest wrapper skips when jsdom is absent, which is right for a
      # laptop and wrong for CI: a green run that tested nothing looks exactly
      # like a green run that tested something.  Invoking node directly means
      # a missing dependency fails the job.
      - name: Install jsdom for the Android page harness
        run: npm install --no-save jsdom
      - name: Android page harness (real DOM, stub bridge)
        run: node tests/android_page_harness.js

      # the same checks windows-exe*.yml run against the frozen exe, here
      # against the package, so a broken smoke script shows up on every push
      # rather than on the next manual Windows build
      - name: Desktop host smoke (page, bridge, workbench run, RTL export)
        run: python packaging/smoke_webhost.py python -m polartx.webhost

      # The one page every host shows (src/polartx/webui/www), in a real
      # Chromium against the real bridge through the desktop host.  The
      # test skips without a browser on a laptop; here that skip is a
      # failure (POLARTX_REQUIRE_BROWSER), because a green run that tested
      # nothing looks exactly like one that tested something.
      - name: Chromium for the page tests
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Page tests (real browser, real bridge)
        env:
          POLARTX_REQUIRE_BROWSER: "1"
        run: pytest tests/test_webui.py tests/test_guispec.py

  # Linux job with iverilog so the RTL bit-true golden tests actually run
  test-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install
        run: pip install -e .[test]
      - name: RTL tests
        run: pytest tests/test_rtl_export.py -q

  # Vendor drift: confirm src/polartx/vendor still matches pinned upstream.
  # Cross-repo checkout of the siblings needs a token scoped to them; if that
  # isn't available the sibling steps no-op and vendor_check.py skips those
  # files (the structural header/manifest tests in the main matrix still gate).
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: polar_tx
      # fetch-depth: 0, and that is load-bearing.  The vendored pllsim files
      # do NOT all sit on one commit: 39 are at 931cfaf, while arch/adpll.py
      # and arch/frac.py stay at d7be4712 because polartx's per-cycle dp_cal
      # hook does not fit upstream's jit kernels (ROADMAP C3).  A shallow
      # checkout of one ref cannot resolve the other, and vendor_check would
      # then SKIP exactly the two files that carry local changes -- a green
      # job that checked nothing.  Full history makes both reachable, and
      # --fail-on-skip below turns any remaining skip red.
      - name: Checkout pll_simulator (pinned)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/pll_simulator
          ref: 931cfaf48aaaf693eefa7088d41c608ee3450b97
          fetch-depth: 0
          path: _siblings/pll_simulator
          # pll_simulator is a PRIVATE repository; the workflow's own
          # GITHUB_TOKEN is scoped to polar_tx and gets "Repository not found"
          # for it (PR #1, run 58), after which every pllsim file is skipped
          # and --fail-on-skip turns the job red -- correctly.  A fine-grained
          # PAT with Contents:read on pll_simulator, stored as the repository
          # secret SIBLING_READ_TOKEN, lets this step read it; without the
          # secret the expression falls back to the default token, which is
          # enough whenever the sibling is public.
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
      # padpd pins are mixed, like pllsim's: pa/thermal.py and
      # gain_modulation.py are at 08b9725 (the ThermalReferencePA FIR-restart
      # fix), everything else at its ancestor 44cbcb3.  Both are on PA_DPD's
      # main; 44cbcb3 lived only on twice-renamed feature branches before
      # 2026-10-03.  Branch names move, SHAs do not: keep checking out the
      # newest pin by full SHA with full history so the older one stays
      # reachable -- a shallow checkout is how files get skipped, which
      # --fail-on-skip turns red.
      - name: Checkout PA_DPD (pinned)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/PA_DPD
          ref: 08b9725595748b290c76d1b70355f7e6014a709e
          fetch-depth: 0
          path: _siblings/PA_DPD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vendor drift check
        working-directory: polar_tx
        run: >
          python tools/vendor_check.py
          --fail-on-skip
          --siblings
          pll_simulator=${{ github.workspace }}/_siblings/pll_simulator
          PA_DPD=${{ github.workspace }}/_siblings/PA_DPD

  # The examples (20 at last count) are the library's worked documentation, and nothing
  # else exercised them — an API change could rot every one of them
  # silently. They cost ~60 s in total, so there is no reason not to.
  examples:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run every example
        run: |
          fail=0
          for f in examples/ex*.py; do
            echo "::group::$f"
            if python "$f"; then echo "OK $f"; else echo "FAILED $f"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      # polartx-web serves the page from the installed package; a wheel
      # without it installs cleanly and serves 404s
      - name: The wheel carries the page
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = [f"polartx/webui/www/{f}" for f in
                  ("index.html", "app.js", "charts.js", "style.css")]
          missing = [n for n in need if n not in names]
          print("missing:", missing)
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
