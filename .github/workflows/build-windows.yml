name: build-windows

# Manual trigger: builds a ONEFILE Windows executable of the desktop GUI
# and smoke-tests it on the runner before upload (sibling-repo pattern).
on:
  workflow_dispatch:

jobs:
  exe-qt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -e .[guiqt]
          pip install pyinstaller
      - name: Build onefile exe
        run: >
          pyinstaller --onefile --windowed --name polartx-gui
          --collect-submodules polartx
          packaging/launch_qt.py
      - name: Smoke test (open, render, auto-quit)
        shell: pwsh
        run: |
          $env:POLARTX_SMOKE = "1"
          $p = Start-Process -FilePath dist/polartx-gui.exe -PassThru
          $p | Wait-Process -Timeout 120
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: polartx-gui-windows
          path: dist/polartx-gui.exe
