name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # extra Python versions only on Linux to keep the matrix small
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[test]
      - name: Test
        run: pytest tests/ -q
        # OpenDPD-dataset tests skip automatically without the dataset
        # clone; GUI tests skip without PySide6; RTL golden tests skip
        # without iverilog (dedicated jobs below exercise those).

  # Linux job with the Qt runtime + streamlit so BOTH GUI frontends are
  # actually exercised (Qt offscreen; the web pages via streamlit AppTest,
  # which executes each page script and clicks every button).
  test-gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt runtime libs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install
        run: pip install -e .[test,guiqt,gui]
      - name: GUI tests (Qt + web + headless compute layer)
        run: pytest tests/test_gui_qt.py tests/test_gui_web.py tests/test_guiutil.py -q

  # Linux job with iverilog so the RTL bit-true golden tests actually run
  test-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install
        run: pip install -e .[test]
      - name: RTL tests
        run: pytest tests/test_rtl_export.py -q

  # Vendor drift: confirm src/polartx/vendor still matches pinned upstream.
  # Cross-repo checkout of the siblings needs a token scoped to them; if that
  # isn't available the sibling steps no-op and vendor_check.py skips those
  # files (the structural header/manifest tests in the main matrix still gate).
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: polar_tx
      # pin to the exact vendored commits so `git show <sha>` resolves; if the
      # sha isn't reachable the checkout no-ops and vendor_check.py skips those
      # files (still non-fatal), and the structural tests keep gating.
      - name: Checkout pll_simulator (pinned)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/pll_simulator
          ref: d7be47124227b6d315e390cae3c7a0e92e58a3f8
          path: _siblings/pll_simulator
      - name: Checkout PA_DPD (pinned)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/PA_DPD
          ref: 44f9ee99dc055c8a4d48a6eee2f14ee2e5f80b06
          path: _siblings/PA_DPD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vendor drift check
        working-directory: polar_tx
        run: >
          python tools/vendor_check.py
          --siblings
          pll_simulator=${{ github.workspace }}/_siblings/pll_simulator
          PA_DPD=${{ github.workspace }}/_siblings/PA_DPD

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
