[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polartx"
version = "0.1.0"
description = "Behavioral simulation of digital polar transmitters: ADPLL two-point (narrowband, BLE/LTE) and open-loop DTC phase modulation (wideband, WiFi 6/7 / 5G NR) with a digital PA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest"]
gui = ["streamlit>=1.30"]
guiqt = ["PySide6>=6.5"]

[project.scripts]
polartx-gui = "polartx.guiqt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# src/polartx/vendor/ is a verifiable adapted copy of pll_simulator and
# PA_DPD, not a fork (CONTRIBUTING.md 2).  Linting it would push toward
# edits whose only purpose is silencing a warning, and every such edit has
# to be declared in tools/vendor_manifest.json or the drift checker fails.
# Upstream's style is upstream's business.
extend-exclude = ["src/polartx/vendor"]

[tool.ruff.lint]
# The default rule set (E4/E7/E9/F) minus three codes that carry no defect
# signal in this codebase.  Pyflakes (F) is the part that pays: an unused
# import or an assigned-and-never-read local is usually a reference that got
# dropped in a rewrite, which is exactly the failure mode CONTRIBUTING.md 1
# is about.  E7 is kept for E711/E712/E713/E714/E722, which are real.
ignore = [
    "E702",   # semicolon-compacted plotting lines; deliberate, and dense on purpose
    "E731",   # one lambda in a table-driven test reads better than a def
    "E741",   # `l` as a loop variable in two examples
]

[tool.mypy]
python_version = "3.10"          # the floor requires-python declares
files = ["src/polartx"]
ignore_missing_imports = true    # streamlit / PySide6 ship no stubs here
warn_unused_configs = true
# The vendor tree is checked for TYPES but not for ERRORS: annotations there
# are what makes ofdm_ref and fir_tx checkable on this side, while a warning
# inside a verbatim copy is upstream's to fix (17 of the 26 errors this
# config started from live there).  follow_imports = "silent" is what buys
# the first without the second.
exclude = "^src/polartx/vendor/"

[[tool.mypy.overrides]]
module = "polartx.vendor.*"
follow_imports = "silent"

[tool.ruff.lint.per-file-ignores]
# The examples import next to the plot panel they serve, so the narrative
# reads top to bottom.  That is the point of an example script.
"examples/*" = ["E402"]
