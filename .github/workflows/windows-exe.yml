name: windows-exe

# PyInstaller ONEFILE Windows executable of the desktop host (fast build,
# self-extracting): polartx.webhost serving the one page, opened in an Edge
# app window, stopping when the window closes.  The exe is smoke-tested on
# the runner before upload.  Nuitka counterpart: windows-exe-nuitka.yml.
#
# One job, where there used to be two (Qt and Streamlit): the page is the
# only GUI now, and the exe carries no Qt and no Streamlit.
#
# Trigger: Actions -> windows-exe -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the exe to (optional)"
        required: false
        default: ""

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # not editable: the freezer then reads polartx, page included, from
      # site-packages exactly as a user's install would lay it out
      - name: Install
        run: |
          pip install .
          pip install pyinstaller
      # console kept: it is the server log, and the one visible handle on the
      # process when no Edge/Chrome is found and the page opens in a tab
      - name: Build exe (onefile)
        run: >
          pyinstaller --onefile --name polartx-gui
          --icon packaging/icon.ico
          --collect-submodules polartx --collect-data polartx
          packaging/launch_webhost.py
      # page + assets, the bridge, a workbench run and the desktop-only RTL
      # export, all through the frozen exe (packaging/smoke_webhost.py)
      - name: Smoke exe
        run: python packaging/smoke_webhost.py dist/polartx-gui.exe
      - uses: actions/upload-artifact@v4
        with:
          name: polartx-gui-windows
          path: dist/polartx-gui.exe
      - name: Attach to release (optional)
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/polartx-gui.exe --clobber
